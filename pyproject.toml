[project]
name = "cm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kblee0", email = "kblee0@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pillow>=12.3.0",
    "pystray>=0.19.5",
    "pywin32>=312",
    "tendo>=0.3.0",
]

[project.scripts]
cm = "cm.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.0",
]
